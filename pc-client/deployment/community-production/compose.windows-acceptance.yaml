# Docker Desktop on Windows: keep MariaDB's datadir inside Docker's Linux VM.
# This replaces only the community-database /var/lib/mysql bind mount from the
# production base Compose file. It is for disposable local acceptance runs,
# never the Linux production deployment.
services:
  community-database:
    volumes:
      - community_acceptance_database:/var/lib/mysql

volumes:
  community_acceptance_database:
