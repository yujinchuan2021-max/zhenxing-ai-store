<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Hub CMS</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><span>A</span><b>AI Hub</b><small>CMS</small></div>
        <p>内容管理</p>
        <nav>
          <button class="active" data-view="home">首页内容</button>
          <button data-view="vendors">厂商管理</button>
          <button data-view="products">产品管理</button>
          <button data-view="extensions">扩展资源</button>
          <button data-view="discovery">产品候选</button>
          <button data-view="sections">其他板块</button>
          <button data-view="publish">发布设置</button>
        </nav>
        <div class="summary">
          <span>当前草稿</span>
          <b id="vendorCount">—</b>
          <small>个厂商</small>
          <b id="productCount">—</b>
          <small>个产品</small>
          <b id="extensionCount">—</b>
          <small>个扩展资源</small>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p>AI HUB · CONTENT SYSTEM</p>
            <h1 id="pageTitle">首页内容</h1>
          </div>
          <div class="topActions">
            <span id="saveState">正在读取目录…</span>
            <button id="saveButton" class="secondary">保存草稿</button>
            <button id="publishButton" class="primary">发布到 PC 客户端</button>
          </div>
        </header>
        <main id="content" class="content"></main>
      </section>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="/app.js"></script>
  </body>
</html>
