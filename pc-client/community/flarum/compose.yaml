services:
  forum:
    build:
      context: .
      args:
        FLARUM_VERSION: ${FLARUM_VERSION:-2.0.0-rc.5}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${FORUM_BIND_ADDRESS:-127.0.0.1}:${FORUM_PORT:-8088}:80"
    volumes:
      - forum-config:/var/lib/flarum
      - forum-storage:/var/www/html/storage
      - forum-assets:/var/www/html/public/assets

  database:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${FORUM_DB_NAME}
      MARIADB_USER: ${FORUM_DB_USER}
      MARIADB_PASSWORD: ${FORUM_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${FORUM_DB_ROOT_PASSWORD}
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - forum-database:/var/lib/mysql

volumes:
  forum-config:
  forum-storage:
  forum-assets:
  forum-database:

