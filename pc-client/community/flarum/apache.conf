<Directory ${APACHE_DOCUMENT_ROOT}>
    AllowOverride All
    Options FollowSymLinks
    Require all granted
</Directory>

<DirectoryMatch "^/.*/(?:vendor|storage|tests|workbench)/">
    Require all denied
</DirectoryMatch>

SetEnvIf Request_URI "^/aihub-(?:sso|community-management)\.php" aihub_no_access_log

ServerTokens Prod
ServerSignature Off
