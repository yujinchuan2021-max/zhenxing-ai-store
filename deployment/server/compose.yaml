name: zhenxing-ai

services:
  website:
    build:
      context: ../..
      dockerfile: deployment/server/website.Dockerfile
    image: zhenxing-ai/website:${AIHUB_DEPLOY_VERSION:-current}
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 384m
    logging: &default_logging
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    build:
      context: ../../pc-client
      dockerfile: deployment/local/admin.Dockerfile
    image: zhenxing-ai/admin:${AIHUB_DEPLOY_VERSION:-current}
    environment:
      AIHUB_ADMIN_HOST: 0.0.0.0
      AIHUB_ADMIN_PORT: 4173
      AIHUB_ADMIN_PUBLIC_ORIGIN: https://${AIHUB_DOMAIN:?set AIHUB_DOMAIN}
      AIHUB_ADMIN_WRITE_ORIGINS: http://127.0.0.1:4173
      AIHUB_CATALOG_ASSET_ORIGIN: https://${AIHUB_DOMAIN:?set AIHUB_DOMAIN}
      AIHUB_DISCOVERY_SCAN_INTERVAL_HOURS: 24
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - admin_data:/app/admin/data
      - admin_published:/app/admin/published
      - catalog_channels:/app/catalog
      - update_channels:/app/updates
      - admin_output:/app/output
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 256m
    logging: *default_logging

  identity-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aihub
      POSTGRES_USER: aihub
      POSTGRES_PASSWORD: ${AIHUB_IDENTITY_DB_PASSWORD:?set AIHUB_IDENTITY_DB_PASSWORD}
    volumes:
      - identity_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihub -d aihub"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 384m
    logging: *default_logging

  identity-community:
    build:
      context: ../../pc-client
      dockerfile: deployment/local/identity.Dockerfile
    image: zhenxing-ai/identity:${AIHUB_DEPLOY_VERSION:-current}
    environment:
      AIHUB_IDENTITY_HOST: 0.0.0.0
      AIHUB_IDENTITY_PORT: 4180
      AIHUB_IDENTITY_PUBLIC_ORIGIN: https://${AIHUB_DOMAIN:?set AIHUB_DOMAIN}
      AIHUB_IDENTITY_DATABASE_URL: postgres://aihub:${AIHUB_IDENTITY_DB_PASSWORD:?set AIHUB_IDENTITY_DB_PASSWORD}@identity-database:5432/aihub
      AIHUB_REGISTRATION_ENABLED: ${AIHUB_REGISTRATION_ENABLED:-false}
      AIHUB_SMTP_HOST: ${AIHUB_SMTP_HOST:-}
      AIHUB_SMTP_PORT: ${AIHUB_SMTP_PORT:-587}
      AIHUB_SMTP_SECURE: ${AIHUB_SMTP_SECURE:-false}
      AIHUB_SMTP_REQUIRE_TLS: ${AIHUB_SMTP_REQUIRE_TLS:-true}
      AIHUB_SMTP_USER: ${AIHUB_SMTP_USER:-}
      AIHUB_SMTP_PASSWORD: ${AIHUB_SMTP_PASSWORD:-}
      AIHUB_MAIL_FROM: ${AIHUB_MAIL_FROM:-ZhenXing AI <no-reply@zhenxingai.com>}
      AIHUB_CATALOG_URL: http://admin:4173/catalog-v1.json
      AIHUB_COMMUNITY_PUBLIC_ORIGIN: https://community.${AIHUB_DOMAIN:?set AIHUB_DOMAIN}
      AIHUB_FORUM_INTERNAL_URL: http://community
      AIHUB_COMMUNITY_INTERNAL_SECRET: ${AIHUB_COMMUNITY_INTERNAL_SECRET:?set AIHUB_COMMUNITY_INTERNAL_SECRET}
    depends_on:
      admin:
        condition: service_healthy
      identity-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4180/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 256m
    logging: *default_logging

  community-database:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: aihub_forum
      MARIADB_USER: aihub_forum
      MARIADB_PASSWORD: ${AIHUB_FORUM_DB_PASSWORD:?set AIHUB_FORUM_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${AIHUB_FORUM_DB_ROOT_PASSWORD:?set AIHUB_FORUM_DB_ROOT_PASSWORD}
    volumes:
      - community_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 384m
    logging: *default_logging

  community:
    build:
      context: ../../pc-client/community/flarum
      dockerfile: Dockerfile
    image: zhenxing-ai/community:${AIHUB_DEPLOY_VERSION:-current}
    environment:
      AIHUB_FORUM_PUBLIC_ORIGIN: https://community.${AIHUB_DOMAIN:?set AIHUB_DOMAIN}
      AIHUB_FORUM_INTERNAL_ORIGIN: http://127.0.0.1
      AIHUB_FORUM_DB_HOST: community-database
      AIHUB_FORUM_DB_PORT: 3306
      AIHUB_FORUM_DB_NAME: aihub_forum
      AIHUB_FORUM_DB_USER: aihub_forum
      AIHUB_FORUM_DB_PASSWORD: ${AIHUB_FORUM_DB_PASSWORD:?set AIHUB_FORUM_DB_PASSWORD}
      AIHUB_FORUM_ADMIN_USER: zhenxing_admin
      AIHUB_FORUM_ADMIN_PASSWORD: ${AIHUB_FORUM_ADMIN_PASSWORD:?set AIHUB_FORUM_ADMIN_PASSWORD}
      AIHUB_FORUM_ADMIN_EMAIL: admin@zhenxingai.com
      AIHUB_FORUM_API_KEY: ${AIHUB_FORUM_API_KEY:?set AIHUB_FORUM_API_KEY}
      AIHUB_FORUM_PASSWORD_TOKEN: ${AIHUB_FORUM_PASSWORD_TOKEN:?set AIHUB_FORUM_PASSWORD_TOKEN}
      AIHUB_IDENTITY_INTERNAL_URL: http://identity-community:4180
      AIHUB_COMMUNITY_INTERNAL_SECRET: ${AIHUB_COMMUNITY_INTERNAL_SECRET:?set AIHUB_COMMUNITY_INTERNAL_SECRET}
    volumes:
      - community_config:/var/lib/flarum
      - community_storage:/var/www/html/storage
      - community_assets:/var/www/html/public/assets
    depends_on:
      community-database:
        condition: service_healthy
      identity-community:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 384
    mem_limit: 512m
    logging: *default_logging

  gateway:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      AIHUB_DOMAIN: ${AIHUB_DOMAIN:?set AIHUB_DOMAIN}
      AIHUB_SERVER_IP: ${AIHUB_SERVER_IP:?set AIHUB_SERVER_IP}
      AIHUB_ACME_EMAIL: ${AIHUB_ACME_EMAIL:?set AIHUB_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      website:
        condition: service_healthy
      admin:
        condition: service_healthy
      identity-community:
        condition: service_healthy
      community:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --header=\"Host: $${AIHUB_SERVER_IP}\" -O /dev/null http://127.0.0.1/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 256
    mem_limit: 128m
    logging: *default_logging

volumes:
  admin_data:
  admin_published:
  admin_output:
  catalog_channels:
  update_channels:
  identity_database:
  community_database:
  community_config:
  community_storage:
  community_assets:
  caddy_data:
  caddy_config:
